<svg xmlns="http://www.w3.org/2000/svg" width="420" height="120" viewBox="0 0 420 120">
  <defs>
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <!-- Outer group centered horizontally in 420px -->
  <g transform="translate(210, 60)">

    <!-- Apple Logo centered: apple is ~80px wide, offset left -->
    <g transform="translate(-145, -50) scale(0.9)">
      <path
        d="M50 20 C20 20 10 50 10 65 C10 90 30 95 50 95
           C70 95 90 90 90 65 C90 50 80 20 50 20"
        fill="url(#appleGrad)"
      />
      <ellipse cx="35" cy="50" rx="12" ry="18" fill="rgba(255,255,255,0.15)"/>
      <path
        d="M50 20 Q52 10 50 5"
        stroke="#78350f"
        stroke-width="5"
        stroke-linecap="round"
        fill="none"
      />
      <path
        d="M52 12 Q70 5 75 15 Q65 20 52 12"
        fill="url(#leafGrad)"
      />
    </g>

    <!-- RipeNet text, centered from middle -->
    <text
      x="30"
      y="0"
      dominant-baseline="middle"
      text-anchor="middle"
      font-size="46"
      font-weight="600"
      letter-spacing="-0.8"
      fill="#0f172a"
      font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    >
      RipeNet
    </text>

  </g>
</svg>
